# Each entry is a separate labeling page at http://localhost:8501/<path>
# Relative configs paths are resolved against this file's directory.
# Rewrite gen-config folder_path / output_folder prefixes for this host.
# Page output_folder (ratings) is not rewritten.
path_rewrites:
  - from: /mnt/b/Storage_10/dev_diego/WM/SurgWorldBench/benchmark_data/benchmark_outputs
    to: /mnt/rater_filesystem/benchmark_outputs
pages:
  - path: control
    title: Control
    configs:
      - gen_configs/control_cosmos_h_og_base.yaml
      - gen_configs/control_cosmos3_super_refined_cosmos.yaml
    output_folder: /mnt/rater_filesystem/benchmark_outputs/benchmark_data_control/human_rating
  - path: experimental
    title: Experimental
    configs:
      - gen_configs/exp_*.yaml
    output_folder: /mnt/rater_filesystem/benchmark_outputs/benchmark_data_experimental/human_rating
