services:
  rater:
    build:
      context: .
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        no_proxy: ${no_proxy:-}
    image: surgworldbench-rater-ui
    ports:
      - "8501:8501"
    volumes:
      # Host data tree must match gen_config folder_path / output_folder
      - ${RATER_FILESYSTEM:-/mnt/rater_filesystem}:/mnt/rater_filesystem
      # Parent mount is writable so Docker can nest gen_configs under it
      - ./harness_configs:/app/harness_configs
      - ./gen_configs:/app/harness_configs/gen_configs:ro
    command:
      - --pages-config
      - /app/harness_configs/base_config.yaml
